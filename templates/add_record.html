<!DOCTYPE html>

<html>

<head>

<title>
Add Medical Record
</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>


<body>


<div class="container mt-5 mb-5">


<h1 class="text-center">
Add Medical Record
</h1>


<form action="/add_record/{{patient_id}}" method="POST">
    

<label class="mt-3">
Symptoms
</label>

<textarea
name="symptoms"
class="form-control"
required></textarea>


<label class="mt-3">
Diagnosis
</label>

<input
type="text"
name="diagnosis"
class="form-control"
required>

<div class="mt-3">

    <label>
        Suggested ICD Code
    </label>

    <input
    type="text"
    name="icd_code"
    class="form-control"
    placeholder="ICD code will appear here"
    readonly>

    <small class="text-muted">
        This is an ICD code suggestion. Please review it before saving.
    </small>

    <div id="matchInfo" class="text-muted mt-2"></div>

</div>


<label class="mt-3">
Prescription
</label>

<textarea
name="prescription"
class="form-control"
required></textarea>


<label class="mt-3">
Notes
</label>

<textarea
name="notes"
class="form-control"></textarea>


<button
type="submit"
class="btn btn-primary mt-4">

Save Record

</button>


</form>


</div>

<script>

const diagnosisInput = document.querySelector('input[name="diagnosis"]');
const symptomsInput = document.querySelector('textarea[name="symptoms"]');
const icdInput = document.querySelector('input[name="icd_code"]');


diagnosisInput.addEventListener("input", function() {

    const diagnosis = diagnosisInput.value.trim();

    if (diagnosis === "") {
        icdInput.value = "";
        return;
    }

    fetch(
    "/get_icd_code?diagnosis=" + encodeURIComponent(diagnosis)
    + "&symptoms=" + encodeURIComponent(symptomsInput.value.trim())
)
        .then(response => response.json())
        .then(data => {

    if (data.icd_code) {

        icdInput.value = data.icd_code;

        document.getElementById("matchInfo").textContent =
    "Matched Symptoms: " + data.matched_symptoms
    + " | Match Score: " + data.match_score + "%";

    } else {

        icdInput.value = "";

        document.getElementById("matchInfo").textContent =
            "No matching symptoms found.";

    }

});

});

</script>


</body>

</html>
