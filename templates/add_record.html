<!DOCTYPE html>

<html>

<head>

<title>
Add Medical Record
</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>


<body>


<div class="container mt-5 mb-5">


<h1 class="text-center">
Add Medical Record
</h1>


<form action="/add_record/{{patient_id}}" method="POST">
    

<label class="mt-3">
Symptoms
</label>

<textarea
name="symptoms"
class="form-control"
required></textarea>


<label class="mt-3">
Diagnosis
</label>

<input
type="text"
name="diagnosis"
class="form-control"
required>

<div class="mt-3">

    <label>
        Suggested ICD Code
    </label>

    <input
    type="text"
    name="icd_code"
    class="form-control"
    placeholder="ICD code will appear here"
    readonly>

    <small class="text-muted">
        This is an ICD code suggestion. Please review it before saving.
    </small>

    <div id="matchInfo" class="text-muted mt-2"></div>
    <div id="suggestionsList" class="mt-3"></div>

</div>


<label class="mt-3">
Prescription
</label>

<textarea
name="prescription"
class="form-control"
required></textarea>


<label class="mt-3">
Notes
</label>

<textarea
name="notes"
class="form-control"></textarea>


<button
type="submit"
class="btn btn-primary mt-4">

Save Record

</button>


</form>


</div>

<script>

const diagnosisInput = document.querySelector('input[name="diagnosis"]');
const symptomsInput = document.querySelector('textarea[name="symptoms"]');
const icdInput = document.querySelector('input[name="icd_code"]');
const matchInfo = document.getElementById("matchInfo");
const suggestionsList = document.getElementById("suggestionsList");


function getICDCode() {

    const diagnosis = diagnosisInput.value.trim();
    const symptoms = symptomsInput.value.trim();

    if (diagnosis === "" && symptoms === "") {

        icdInput.value = "";
        matchInfo.textContent = "";
        suggestionsList.innerHTML = "";

        return;
    }


    fetch(
        "/get_icd_code?diagnosis="
        + encodeURIComponent(diagnosis)
        + "&symptoms="
        + encodeURIComponent(symptoms)
    )

    .then(response => response.json())

    .then(data => {

        suggestionsList.innerHTML = "";

        if (data.suggestions.length > 0) {

            const bestMatch = data.suggestions[0];

            icdInput.value = bestMatch.icd_code;

            matchInfo.textContent =
                "Suggested Diagnosis: "
                + bestMatch.diagnosis
                + " | Matched Symptoms: "
                + bestMatch.matched_symptoms
                + " | Match Score: "
                + bestMatch.match_score
                + "%";


            const heading = document.createElement("h6");

            heading.textContent =
                "Possible ICD Suggestions";

            suggestionsList.appendChild(heading);


            data.suggestions.forEach(function(suggestion, index) {

                const card = document.createElement("div");

                card.className = "card mb-2";


                const cardBody = document.createElement("div");

                cardBody.className = "card-body";


                const radio = document.createElement("input");

                radio.type = "radio";
                radio.name = "icd_suggestion";
                radio.className = "form-check-input me-2";
                radio.value = suggestion.icd_code;

                if (index === 0) {
                    radio.checked = true;
                }


                radio.addEventListener("change", function() {

                    diagnosisInput.value =
                        suggestion.diagnosis;

                    icdInput.value =
                        suggestion.icd_code;

                    matchInfo.textContent =
                        "Selected Diagnosis: "
                        + suggestion.diagnosis
                        + " | Matched Symptoms: "
                        + suggestion.matched_symptoms
                        + " | Match Score: "
                        + suggestion.match_score
                        + "%";

                });


                const label = document.createElement("label");

                label.style.cursor = "pointer";

                label.innerHTML =
                    "<strong>Diagnosis:</strong> "
                    + suggestion.diagnosis
                    + "<br>"
                    + "<strong>ICD Code:</strong> "
                    + suggestion.icd_code
                    + "<br>"
                    + "<strong>Matched Symptoms:</strong> "
                    + suggestion.matched_symptoms
                    + "<br>"
                    + "<strong>Match Score:</strong> "
                    + suggestion.match_score
                    + "%";


                label.prepend(radio);

                cardBody.appendChild(label);

                card.appendChild(cardBody);

                suggestionsList.appendChild(card);

            });

        }

        else {

            icdInput.value = "";

            matchInfo.textContent =
                "No matching symptoms found.";

        }

    });

}


diagnosisInput.addEventListener("input", getICDCode);

symptomsInput.addEventListener("input", getICDCode);

</script>

</body>

</html>
